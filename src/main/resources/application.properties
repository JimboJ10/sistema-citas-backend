spring.application.name=sistema-citas

# Conexion a base de datos (los valores reales vienen de variables de entorno)
spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_citas
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# JWT
app.jwt.secret=${JWT_SECRET:una-clave-secreta-larga-solo-para-desarrollo-cambiar-en-produccion-123456}
app.jwt.expiration-ms=86400000

# Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.chat.temperature=0.3