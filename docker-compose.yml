services:
  postgres:
    image: postgres:16
    container_name: sistema-citas-db
    environment:
      POSTGRES_DB: sistema_citas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    container_name: sistema-citas-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sistema_citas
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../sistema-citas-frontend
    container_name: sistema-citas-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data: